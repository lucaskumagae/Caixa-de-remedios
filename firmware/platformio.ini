[platformio]
default_envs = esp32

; Firmware da caixa (ESP32 DevKit).
;   pio run -t upload      grava o firmware
;   pio run -t uploadfs    grava a pasta data/ (painel web) no LittleFS
[env:esp32]
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
build_flags = -std=gnu++17
build_unflags = -std=gnu++11
lib_deps =
  bblanchon/ArduinoJson@^7.2.1
  adafruit/RTClib@^2.1.4
test_ignore = *

; Testes das regras de negócio no computador: pio test -e native
[env:native]
platform = native
build_flags = -std=gnu++17 -Wall -Wextra
test_build_src = no
