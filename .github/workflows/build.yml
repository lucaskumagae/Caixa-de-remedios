name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  firmware:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio
      - name: Testes das regras de negócio
        run: pio test -e native
      - name: Compilar firmware
        run: pio run -e esp32
      - name: Gerar imagem do painel (LittleFS)
        run: pio run -e esp32 -t buildfs
